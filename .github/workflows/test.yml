# Runs the standalone tests on PHP 8.0 against core's release/7.0 and on PHP 8.2 and 8.5 against develop
# (SHOPCLASS_CORE_REF overrides it). They need no database.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            core: release/7.0
          - php: '8.2'
            core: develop
          - php: '8.5'
            core: develop
    env:
      # The tests find core next to the plugin.
      SHOPCLASS_CORE: ${{ github.workspace }}/shopclass
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Check out core
        uses: actions/checkout@v4
        with:
          repository: mindstellar/shopclass
          ref: ${{ matrix.core == 'develop' && vars.SHOPCLASS_CORE_REF || matrix.core }}
          path: shopclass

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Tests
        working-directory: plugin
        run: ./tests/run.sh
